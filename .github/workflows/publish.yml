name: Publish to npm

# Publishes when a GitHub release is published (e.g. tag v0.2.0).
# Uses npm Trusted Publishing (OIDC): no npm token is stored in this repo.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm CLI
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - name: Check release tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match package.json version v$VERSION"
            exit 1
          fi

      - run: npm publish
