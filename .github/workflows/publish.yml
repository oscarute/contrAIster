name: Publish to npm

# Runs when a GitHub release is published (e.g. tag v0.2.1):
#   1. publishes the package to npm (Trusted Publishing, no token stored in this repo)
#   2. builds the Claude Desktop extension (.mcpb) and attaches it to the release
on:
  release:
    types: [published]

permissions:
  contents: write # attach the .mcpb to the release
  id-token: write # npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm CLI
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      # The release tag (vX.Y.Z) is the source of truth for the version, so package.json
      # does not need to be bumped by hand before creating a release.
      - name: Set version from release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag '$TAG' must look like v1.2.3"
            exit 1
          fi
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # Build before publishing so a packaging failure stops the run before anything irreversible happens
      - name: Build Claude Desktop extension
        run: npm run build:mcpb

      - run: npm publish

      - name: Attach .mcpb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/contraister-*.mcpb --clobber
